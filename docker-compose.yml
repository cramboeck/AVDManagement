version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zerostress-postgres
    environment:
      POSTGRES_USER: zerostress
      POSTGRES_PASSWORD: dev_password_only
      POSTGRES_DB: zerostress
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerostress"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zerostress-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
